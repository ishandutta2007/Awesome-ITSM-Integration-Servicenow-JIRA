<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="jiraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#2684ff" />
    </linearGradient>

    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81b5a1" />
      <stop offset="100%" stop-color="#293e40" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#81b5a1" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-orb {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .data-packet {
        animation: flowRight 3s linear infinite;
      }
      .data-packet-rev {
        animation: flowLeft 3s linear infinite;
      }
      .card-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      .card-float-delayed {
        animation: float 6s ease-in-out infinite alternate;
        animation-delay: -3s;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.25; }
        100% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes flowRight {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(520px); opacity: 0; }
      }
      @keyframes flowLeft {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(-520px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420" />
  </g>

  <!-- Dynamic Glowing Background Orbs (Non-obstructive) -->
  <circle cx="150" cy="120" r="140" fill="#0284c7" class="pulse-orb" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="160" fill="#6366f1" class="pulse-orb" filter="url(#glow)" style="animation-delay: -2s;" />
  <circle cx="600" cy="20" r="100" fill="#a855f7" class="pulse-orb" filter="url(#glow)" style="animation-delay: -1s;" />

  <!-- Animated Data Sync Flow Line at the Bottom -->
  <g opacity="0.85">
    <!-- Connecting sync pipeline line -->
    <path d="M 340 345 L 860 345" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="6 6" />

    <!-- Animated Packets going left-to-right -->
    <g class="data-packet">
      <circle cx="340" cy="345" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
    </g>
    <!-- Animated Packets going right-to-left -->
    <g class="data-packet-rev">
      <circle cx="860" cy="345" r="5" fill="#81b5a1" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Visual Node Left: ServiceNow Card -->
  <g class="card-float" transform="translate(100, 290)">
    <rect width="200" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="url(#snowGrad)" />
    <text x="35" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">S</text>
    <text x="68" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14">ServiceNow</text>
    <text x="68" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ITSM &amp; CMDB Hub</text>
  </g>

  <!-- Visual Node Center: Bi-directional Sync Hub -->
  <g transform="translate(560, 315)">
    <circle cx="40" cy="30" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" />
    <!-- Bidirectional arrow icon -->
    <path d="M 28 26 L 52 26 M 46 20 L 52 26 L 46 32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 52 34 L 28 34 M 34 28 L 28 34 L 34 40" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="40" y="75" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">2-Way Live Sync</text>
  </g>

  <!-- Visual Node Right: Jira Service Management Card -->
  <g class="card-float-delayed" transform="translate(900, 290)">
    <rect width="200" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="url(#jiraGrad)" />
    <!-- Jira diamond shape -->
    <path d="M 28 35 L 35 28 L 42 35 L 35 42 Z" fill="#ffffff" />
    <text x="68" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14">Jira Service</text>
    <text x="68" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">DevOps &amp; Issue Sync</text>
  </g>

  <!-- FOREGROUND: Header & Badges (Completely clear, unblocked) -->
  <!-- Top Category Pill -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">⚡ ENTERPRISE INTEGRATION ECOSYSTEM</text>
  </g>

  <!-- Primary Title -->
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Awesome ITSM Integration
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#f8fafc">
    ServiceNow &amp; Jira Ecosystem
  </text>

  <!-- Tagline / Description -->
  <text x="600" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    Curated Hub for Bidirectional Ticket Syncing, AIOps, CMDB Asset Bridges &amp; Open-Source ITSM Alternatives
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 235)">
    <!-- Pill 1 -->
    <rect x="-310" y="-12" width="140" height="25" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="-240" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔄 2-Way Ticket Sync</text>

    <!-- Pill 2 -->
    <rect x="-155" y="-12" width="140" height="25" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="-85" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🤖 AIOps &amp; Incident</text>

    <!-- Pill 3 -->
    <rect x="0" y="-12" width="140" height="25" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="70" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🗄️ CMDB &amp; Assets</text>

    <!-- Pill 4 -->
    <rect x="155" y="-12" width="155" height="25" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="232" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🚀 Open-Source ITSM</text>
  </g>
</svg>
